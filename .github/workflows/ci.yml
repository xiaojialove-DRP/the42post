name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # No npm cache here: actions/setup-node's cache-dependency-path glob
      # did not resolve against backend/package-lock.json when combined
      # with this job's working-directory default (failed in CI with
      # "Some specified paths were not resolved"). Caching is a speed
      # optimization, not a correctness requirement - dropped it rather
      # than fight the path resolution to get a reliably green workflow.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  frontend-syntax:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No bundler/build step for the frontend (plain script tags), so the
      # cheapest real safety net is making sure every JS file still parses -
      # this session alone hit a few near-misses from large script.js edits.
      - name: Check all frontend JS files parse
        run: |
          for f in $(find frontend -name "*.js" -not -path "*/node_modules/*"); do
            echo "Checking $f"
            node --check "$f"
          done

  e2e-tests:
    name: Browser e2e (Forge/Playground/Archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test
        env:
          # No real DEEPSEEK_API_KEY/ANTHROPIC_API_KEY in CI - every spec is
          # written to pass either way (real generation or clean fallback/
          # error messaging), same contract the backend tests already rely on.
          NODE_ENV: development
          JWT_SECRET: ci_jwt_secret_minimum_32_characters_long_enough_for_tests
          SIGNING_SECRET: ci_signing_secret_minimum_32_chars_long_enough_for_tests
          DATABASE_URL: ''
          POSTGRES_URI: ''

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
