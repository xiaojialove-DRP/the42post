<!DOCTYPE html>
<html>
<head>
    <title>清理localStorage</title>
</head>
<body>
    <h1>清理Forged Skills</h1>
    <button onclick="cleanUp()">点击清空所有localStorage forged skills</button>
    <p id="result"></p>

    <script>
        function cleanUp() {
            const before = JSON.parse(localStorage.getItem('42post_recent_forges') || '[]').length;
            localStorage.removeItem('42post_recent_forges');
            localStorage.removeItem('starred_skills');
            const after = JSON.parse(localStorage.getItem('42post_recent_forges') || '[]').length;
            document.getElementById('result').innerText =
                `✓ 已清空 ${before} 个forged skills\n现在localStorage中没有低质量skills\n刷新页面即可生效`;
        }
    </script>
</body>
</html>
