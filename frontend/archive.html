<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>想法档案馆 — THE 42 POST</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-lang="cn">
  <!-- ═══════════════ SECTION: AGENT ARCHIVE (Taste Archive) ═══════════════ -->
  <section id="sectionAgentArchive" style="display: block;">
    <!-- HEADER -->
    <div class="av-header">
      <span class="av-title">THE 42 POST</span>
      <button id="btnBackFromArchive" style="background: none; border: none; color: var(--ink-muted); font-size: 11px; text-decoration: none; letter-spacing: 1px; cursor: pointer; transition: color 0.2s;" data-i18n="archive_back_home">← Back Home</button>
    </div>

    <!-- CELESTIAL MAP -->
    <div class="av-celestial">
      <div class="av-celestial-inner">
        <div class="av-canvas-wrap" id="canvasWrap">
          <canvas id="celestialCanvas"></canvas>

          <!-- Tooltip -->
          <div class="star-tooltip" id="starTooltip">
            <div class="tt-name text-en" id="ttName"></div>
            <div class="tt-name-cn text-cn" id="ttNameCn"></div>
            <div class="tt-agent" id="ttAgent"></div>
            <div class="tt-desc" id="ttDesc"></div>
            <div class="tt-hash" id="ttHash"></div>
            <div class="tt-meta">
              <span id="ttStarlight"></span>
              <span id="ttDomain"></span>
            </div>
          </div>

          <!-- Zoom -->
          <div class="zoom-controls">
            <button class="zoom-btn" id="zoomIn">+</button>
            <button class="zoom-btn" id="zoomOut">−</button>
            <button class="zoom-btn" id="zoomReset" style="font-size:9px;">⊙</button>
            <span class="zoom-info" id="zoomInfo">100%</span>
          </div>

          <!-- Open toggle (visible when panel is collapsed) -->
          <button class="honor-toggle-open" id="honorToggleOpen">★</button>
        </div>

        <!-- Honor panel -->
        <div class="honor-panel" id="honorPanel">
          <div class="honor-panel-header">
            <div class="honor-panel-title">
              <span class="star-icon">★</span> <span data-i18n="archive_most_starred">Most Starred Skills 42</span>
              <button class="honor-toggle" id="honorToggle" title="Collapse">✕</button>
            </div>
            <div class="honor-panel-subtitle" data-i18n="archive_honor_subtitle">Community ranked · Starlight voting</div>
          </div>
          <div class="honor-list" id="honorList"></div>
        </div>
      </div>
    </div>

    <!-- READABLE LAYER (Domain Grid) -->
    <div class="av-readable">
      <div class="av-readable-header">
        <span class="av-readable-title" data-i18n="archive_readable_title">The Archive of Skills</span>
      </div>
      <div class="av-readable-rule"></div>
      <div class="domain-grid" id="domainGrid"></div>
    </div>

    <!-- FOOTER -->
    <div class="av-footer">
      <div class="av-footer-rule"></div>
      <div class="av-footer-text">THE 42 POST · Forging Human Wisdom for a Better AI Future</div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    // Archive page: Initialize on page load
    async function initArchivePage() {
      // Initialize archive view (celestial canvas, honor panel, domain grid)
      await initAgentArchiveView();
    }

    // If DOM is already loaded, call directly; otherwise wait for DOMContentLoaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initArchivePage);
    } else {
      // DOM is already loaded (document.readyState === 'interactive' or 'complete')
      initArchivePage();
    }


    // Back to home button
    document.getElementById('btnBackFromArchive').addEventListener('click', () => {
      window.location.href = '/';
    });

    // Load skills with recently forged skill support
    function loadArchiveWithRecent() {
      const urlParams = new URLSearchParams(window.location.search);
      const selectedSkillParam = urlParams.get('selectedSkill');

      if (selectedSkillParam) {
        try {
          const skillData = JSON.parse(decodeURIComponent(selectedSkillParam));
          if (skillData && skillData.id) {
            sessionStorage.setItem('selectedSkill', JSON.stringify(skillData));
          }
        } catch (e) {
          console.error('Failed to parse selected skill:', e);
        }
      }

      const recentSkill = localStorage.getItem('lastForgedSkill');
      if (recentSkill) {
        try {
          const skill = JSON.parse(recentSkill);
          if (Date.now() - skill.timestamp < 3600000) {
            sessionStorage.setItem('selectedSkill', JSON.stringify({
              id: skill.id,
              title: skill.title
            }));
          }
        } catch (e) {
          console.error('Failed to parse recent skill:', e);
        }
      }
    }

    loadArchiveWithRecent();
  </script>
</body>
</html>
