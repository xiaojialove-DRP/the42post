    /* ── State ── */
    let cardIdCounter = 0;
    let highestZ = 10;
    let activeCard = null;
    let dragState = null;


    /* ── Card Library Management ── */
    function saveCreativeCard(taskTitle, userSolution, skillA, skillB) {
      const card = {
        id: 'card_' + Date.now(),
        taskTitle: taskTitle,
        userSolution: userSolution,
        skillA: skillA,
        skillB: skillB,
        timestamp: Date.now(),
        dateStr: new Date().toLocaleDateString()
      };

      let cards = JSON.parse(localStorage.getItem('42post_creative_cards') || '[]');
      cards.unshift(card); // 添加到开头（最新的卡片在前）
      cards = cards.slice(0, 100); // 最多保存100张卡片
      localStorage.setItem('42post_creative_cards', JSON.stringify(cards));

      displayCardLibrary();
      return card;
    }

    function getCreativeCards() {
      return JSON.parse(localStorage.getItem('42post_creative_cards') || '[]');
    }

    function displayCardLibrary() {
      const cards = getCreativeCards();
      const grid = document.getElementById('libraryGrid');
      const count = document.getElementById('libraryCount');
      const isChineseMode = (typeof currentLang !== 'undefined' && currentLang === 'cn');

      if (cards.length === 0) {
        const emptyCountText = isChineseMode ? '0 张卡片' : '0 cards';
        const emptyMsg = isChineseMode ? '暂无创意卡片。在Playground中创建你的第一张卡片吧！' : 'No creative cards yet. Create your first card in the Playground!';
        count.textContent = emptyCountText;
        grid.innerHTML = `<div class="library-empty">${emptyMsg}</div>`;
        return;
      }

      const countText = isChineseMode ? cards.length + ' 张卡片' : cards.length + ' cards';
      count.textContent = countText;
      grid.innerHTML = cards.map(card => `
        <div class="library-card">
          <div class="library-card-task">${card.taskTitle}</div>
          <div class="library-card-solution">"${card.userSolution}"</div>
          <div class="library-card-skills">
            <span class="library-card-skill">${card.skillA}</span>
            <span class="library-card-skill">+</span>
            <span class="library-card-skill">${card.skillB}</span>
          </div>
          <div class="library-card-meta">
            <span>${card.dateStr}</span>
          </div>
        </div>
      `).join('');
    }



    /* ── Workspace Tabs & Creations View ── */
    function displayCreations() {
      const cards = getCreativeCards();
      const grid = document.getElementById('creationsGrid');
      const isChineseMode = (typeof currentLang !== 'undefined' && currentLang === 'cn');

      if (cards.length === 0) {
        const emptyTitle = isChineseMode ? '还没有创意作品' : 'No creative works yet';
        const emptyText = isChineseMode ? '在CREATIVE WORKSPACE中完成创意任务，你的答案将显示在这里' : 'Complete creative tasks in the Playground to see your creations here';
        grid.innerHTML = `
          <div class="creations-empty" style="grid-column: 1 / -1;">
            <div class="creations-empty-title">${emptyTitle}</div>
            <div class="creations-empty-text">${emptyText}</div>
          </div>
        `;
        return;
      }

      const answerLabel = isChineseMode ? '你的答案' : 'Your Answer';
      grid.innerHTML = cards.map(card => `
        <div class="creation-card">
          <div class="creation-task">${card.taskTitle}</div>
          <div class="creation-task-title">${answerLabel}</div>
          <div class="creation-answer">"${card.userSolution}"</div>
          <div class="creation-skills">
            <span class="creation-skill">✦ ${card.skillA}</span>
            <span style="color:var(--ink-muted);">+</span>
            <span class="creation-skill">✦ ${card.skillB}</span>
          </div>
          <div class="creation-date">${card.dateStr}</div>
        </div>
      `).join('');
    }

    function setupCreationsButton() {
      const btnAllCreations = document.getElementById('btnAllCreations');
      const creationsView = document.getElementById('creationsView');
      
      if (!btnAllCreations) return;
      
      btnAllCreations.addEventListener('click', () => {
        if (creationsView.classList.contains('active')) {
          creationsView.classList.remove('active');
        } else {
          creationsView.classList.add('active');
          displayCreations();
        }
      });
      
      // 点击关闭（在header点击）
      const header = document.querySelector('.creations-header');
      if (header) {
        header.style.cursor = 'pointer';
        header.addEventListener('click', () => {
          creationsView.classList.remove('active');
        });
      
      const btnClose = document.getElementById('btnCloseCreations');
      if (btnClose) {
        btnClose.addEventListener('click', (e) => {
          e.stopPropagation();
          creationsView.classList.remove('active');
        });
      }
      }
    }


    /* ── Build Dock ── */
    function buildDock() {
      const dock = document.getElementById('workshopDock');
      dock.innerHTML = ''; // Clear existing items
      REPOSITORIES.forEach(repo => {
        const item = document.createElement('div');
        item.className = 'dock-item';
        item.style.setProperty('--dock-color', repo.color);
        item.innerHTML = `
          <span class="dock-icon" style="color:${repo.color}">${repo.icon}</span>
          <span>${getRepoName(repo)}</span>
          <span class="dock-count">${repo.tasks.length}</span>
        `;
        item.addEventListener('click', () => spawnRandomFromRepo(repo));
        dock.appendChild(item);
      });
    }

    /* ── Spawn a task card ── */
    function spawnCard(task, repo) {
      // Twin Test is the only mode now. The card itself handles both states:
      // skill already loaded (from ?skill= or a previous in-card pick) -> A/B,
      // no skill yet -> in-card hot-skill picker that promotes to A/B on select.
      // Old fusion-mode card kept as spawnCard__legacyFusion for safety.
      return spawnTwinTestCard(task, repo);
    }

    /* ── Old fusion-mode spawnCard (unused, retained for safety) ── */
    function spawnCard__legacyFusion(task, repo) {
      const canvas = document.getElementById('workshopCanvas');
      const empty = document.getElementById('canvasEmpty');
      empty.classList.add('hidden');

      const card = document.createElement('div');
      card.className = 'task-card spawning';
      card.dataset.cardId = ++cardIdCounter;
      card.style.zIndex = ++highestZ;

      // Random position (avoid overlap)
      const maxX = canvas.clientWidth - 340;
      const maxY = canvas.clientHeight - 300;
      const x = 40 + Math.random() * Math.max(maxX - 80, 100);
      const y = 30 + Math.random() * Math.max(maxY - 60, 100);
      card.style.left = x + 'px';
      card.style.top = y + 'px';
      card.style.setProperty('--card-color', repo.color);

      const taskDisplay = getTaskDisplay(task);
      const isChineseMode = (typeof currentLang !== 'undefined' && currentLang === 'cn');

      card.innerHTML = `
        <div class="card-header">
          <div class="card-header-left">
            <div class="card-domain-dot" style="background:${repo.color}"></div>
            <div class="card-domain-label">${getRepoName(repo)}</div>
          </div>
          <button class="card-close" title="Close">✕</button>
        </div>
        <div class="card-body">
          <div class="card-task-label">${isChineseMode ? '品味问题' : 'TASTE QUESTION'}</div>
          <div class="card-title">${taskDisplay.title}</div>
          <div class="card-desc">${taskDisplay.desc}</div>
          <div class="card-skills-needed">${isChineseMode ? '选择2个品味技能' : 'PICK 2 TASTE-SKILLS TO COMBINE'}</div>
          <div class="card-fusion-slots">
            <div class="fusion-slot" data-slot="A">
              <div class="fusion-slot-label">${isChineseMode ? '技能 A' : 'SKILL A'}</div>
              <div class="fusion-slot-hint">${isChineseMode ? '点击选择' : 'click to pick'}</div>
            </div>
            <div class="fusion-slot" data-slot="B">
              <div class="fusion-slot-label">${isChineseMode ? '技能 B' : 'SKILL B'}</div>
              <div class="fusion-slot-hint">${isChineseMode ? '点击选择' : 'click to pick'}</div>
            </div>
          </div>
          <div class="skill-picker"></div>
          <div class="card-skill-tags">
            ${task.skills.map(s => `<span class="card-skill-tag">${s}</span>`).join('')}
          </div>
        </div>
        <div class="card-footer">
          <div class="card-difficulty">${task.difficulty}</div>
          <button class="card-btn-start">${isChineseMode ? '打开画布 ↓' : 'OPEN CANVAS ↓'}</button>
        </div>
        <div class="card-response">
          <textarea placeholder="${isChineseMode ? '写下你的答案。有品味的AI会如何处理这种情况？' : 'Write your answer. How would an AI with taste handle this situation?'}"></textarea>
          <button class="card-btn-submit">${isChineseMode ? '⚔ 提交创意' : '⚔ SUBMIT FUSION'}</button>
          <div class="card-result"></div>
        </div>
        <div class="card-resize-handle" title="Drag to resize"></div>
      `;

      // ── Skill Fusion Picker ──
      const fusionSlots = card.querySelectorAll('.fusion-slot');
      const picker = card.querySelector('.skill-picker');
      let activeSlot = null;
      const selectedSkills = { A: null, B: null };

      fusionSlots.forEach(slot => {
        slot.addEventListener('click', (e) => {
          e.stopPropagation();
          if (slot.classList.contains('filled')) return;
          activeSlot = slot.dataset.slot;
          picker.innerHTML = ARENA_SKILL_POOL
            .filter(s => s.name !== selectedSkills.A && s.name !== selectedSkills.B)
            .map(s => `<div class="skill-picker-item" data-skill="${s.name}"><div class="spi-name">${s.name}</div><div class="spi-desc">${s.desc}</div></div>`)
            .join('');
          picker.classList.add('open');
        });
      });

      picker.addEventListener('click', (e) => {
        const item = e.target.closest('.skill-picker-item');
        if (!item || !activeSlot) return;
        const skillName = item.dataset.skill;
        selectedSkills[activeSlot] = skillName;
        const slot = card.querySelector(`.fusion-slot[data-slot="${activeSlot}"]`);
        slot.classList.add('filled');
        slot.innerHTML = `<div class="fusion-slot-label">SKILL ${activeSlot}</div><div class="fusion-slot-name">${skillName}</div>`;
        picker.classList.remove('open');
        activeSlot = null;
      });

      // Close picker on outside click
      card.addEventListener('click', (e) => {
        if (!e.target.closest('.fusion-slot') && !e.target.closest('.skill-picker')) {
          picker.classList.remove('open');
        }
      });

      // Close button
      card.querySelector('.card-close').addEventListener('click', (e) => {
        e.stopPropagation();
        card.classList.add('minimizing');
        setTimeout(() => {
          card.remove();
          checkEmpty();
        }, 300);
      });

      // Focus on click
      card.addEventListener('mousedown', (e) => {
        if (e.target.closest('.card-close')) return;
        if (!e.target.closest('.card-resize-handle') && !e.target.closest('button') && !e.target.closest('textarea')) {
          card.style.zIndex = ++highestZ;
        }
      });

      // Drag - anywhere on the card except buttons, textarea, and close button
      card.addEventListener('mousedown', (e) => {
        // Don't drag from buttons, textarea, close button, or resize handle
        if (e.target.closest('.card-close') || e.target.closest('button') ||
            e.target.closest('textarea') || e.target.closest('.card-resize-handle')) return;

        e.preventDefault();
        card.classList.add('dragging');
        card.style.zIndex = ++highestZ;
        dragState = {
          card,
          startX: e.clientX - card.offsetLeft,
          startY: e.clientY - card.offsetTop,
        };
      });

      // Touch drag - anywhere on the card
      card.addEventListener('touchstart', (e) => {
        // Don't drag from buttons, textarea, close button, or resize handle
        if (e.target.closest('.card-close') || e.target.closest('button') ||
            e.target.closest('textarea') || e.target.closest('.card-resize-handle')) return;

        const touch = e.touches[0];
        card.classList.add('dragging');
        card.style.zIndex = ++highestZ;
        dragState = {
          card,
          startX: touch.clientX - card.offsetLeft,
          startY: touch.clientY - card.offsetTop,
        };
      }, { passive: true });

      // Resize handle - mouse
      const resizeHandle = card.querySelector('.card-resize-handle');
      resizeHandle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        card.classList.add('resizing');
        card.style.zIndex = ++highestZ;
        dragState = {
          card,
          isResizing: true,
          startX: e.clientX,
          startY: e.clientY,
          startWidth: card.offsetWidth,
          startHeight: card.offsetHeight,
        };
      });

      // Resize handle - touch
      resizeHandle.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        card.classList.add('resizing');
        card.style.zIndex = ++highestZ;
        dragState = {
          card,
          isResizing: true,
          startX: touch.clientX,
          startY: touch.clientY,
          startWidth: card.offsetWidth,
          startHeight: card.offsetHeight,
        };
      }, { passive: true });

      // Open response area
      const startBtn = card.querySelector('.card-btn-start');
      const responseArea = card.querySelector('.card-response');
      startBtn.addEventListener('click', () => {
        const isOpen = responseArea.classList.contains('open');
        responseArea.classList.toggle('open');
        const openText = isChineseMode ? '打开画布 ↓' : 'OPEN CANVAS ↓';
        const closeText = isChineseMode ? '关闭画布 ↑' : 'CLOSE CANVAS ↑';
        startBtn.textContent = isOpen ? openText : closeText;
        if (!isOpen) card.style.width = '380px';
        else card.style.width = '320px';
      });

      // Submit response
      const submitBtn = card.querySelector('.card-btn-submit');
      const resultEl = card.querySelector('.card-result');
      submitBtn.addEventListener('click', () => {
        const textarea = card.querySelector('.card-response textarea');
        const text = textarea.value.trim();
        if (!text || text.length < 10) {
          textarea.style.borderColor = '#c0392b';
          setTimeout(() => { textarea.style.borderColor = ''; }, 1000);
          return;
        }

        // Check if 2 skills are selected
        if (!selectedSkills.A || !selectedSkills.B) {
          card.querySelectorAll('.fusion-slot:not(.filled)').forEach(s => {
            s.style.borderColor = '#c0392b';
            setTimeout(() => { s.style.borderColor = ''; }, 1000);
          });
          return;
        }

        submitBtn.textContent = '⚔ CREATING...';
        submitBtn.style.background = 'var(--ink)';
        submitBtn.style.pointerEvents = 'none';

        setTimeout(() => {
          // 保存卡片到localStorage
          const cardTitle = isChineseMode ? (task.titleCn || task.title) : task.title;
          saveCreativeCard(cardTitle, text, selectedSkills.A, selectedSkills.B);

          const savedMessage = isChineseMode ? '✓ 已保存到"我的创意作品"' : '✓ Saved to "My Creations"';
          const viewMessage = isChineseMode ? '点击顶部"全部创意"查看你的所有作品' : 'Click "ALL CREATIONS" at the top to view all your work';

          resultEl.innerHTML = `
            <div style="text-align:center;padding:16px;color:var(--accent-green);">
              <div style="font-size:14px;font-weight:700;margin-bottom:8px;">${savedMessage}</div>
              <div style="font-size:11px;color:var(--ink-muted);">${viewMessage}</div>
            </div>
          `;
          resultEl.classList.add('visible');

          const savedText = isChineseMode ? '✓ 已保存' : '✓ SAVED';
          const submitText = isChineseMode ? '⚔ 提交创意' : '⚔ SUBMIT FUSION';

          submitBtn.textContent = savedText;
          submitBtn.style.background = 'var(--accent-green)';
          setTimeout(() => {
            submitBtn.textContent = submitText;
            submitBtn.style.background = '';
            submitBtn.style.pointerEvents = '';
          }, 3000);
        }, 800);
      });

      canvas.appendChild(card);

      // Remove spawn animation class
      setTimeout(() => card.classList.remove('spawning'), 350);
    }

    /* ── Spawn random from repo ── */
    function spawnRandomFromRepo(repo) {
      const task = repo.tasks[Math.floor(Math.random() * repo.tasks.length)];
      spawnCard(task, repo);
    }

    /* ── "Try Another Scenario" — limited to 7 plays per session ── */
    let twinScenarioCount = 0;
    const TWIN_SCENARIO_LIMIT = 7;
    // Global set of used scenario identifiers (repo:taskTitle) to prevent duplicates across all repos
    const usedScenarioBatch = new Set();

    function handleTryAnotherScenario(currentCard, repo) {
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');

      // Reached the limit — show a friendly farewell
      if (twinScenarioCount >= TWIN_SCENARIO_LIMIT) {
        const stageThanks = currentCard.querySelector('.twin-thanks');
        if (stageThanks) {
          const actions = stageThanks.querySelector('.twin-thanks-actions');
          if (actions) {
            actions.innerHTML = `<div class="twin-farewell-msg">${isCn
              ? '你已经体验了 7 个场景，很棒了。休息一下吧 ☕️'
              : 'You\'ve explored 7 scenarios — well played. Time for a break ☕️'}</div>`;
          }
        }
        return;
      }

      twinScenarioCount++;

      // Mark current scenario as used
      const currentTitle = currentCard.querySelector('.twin-scenario-title')?.textContent;
      if (currentTitle) {
        usedScenarioBatch.add(currentTitle);
      }

      // Build list of all available scenarios from all repos
      let allCandidates = [];
      for (const r of REPOSITORIES) {
        for (const t of r.tasks) {
          const taskDisplay = getTaskDisplay(t);
          const scenarioId = taskDisplay.title;
          if (!usedScenarioBatch.has(scenarioId)) {
            allCandidates.push({ task: t, repo: r, scenarioId });
          }
        }
      }

      // If no unused candidates remain, stop (don't repeat)
      if (allCandidates.length === 0) {
        const stageThanks = currentCard.querySelector('.twin-thanks');
        if (stageThanks) {
          const actions = stageThanks.querySelector('.twin-thanks-actions');
          if (actions) {
            actions.innerHTML = `<div class="twin-farewell-msg">${isCn
              ? '你已经体验了 7 个场景，很棒了。休息一下吧 ☕️'
              : 'You\'ve explored 7 scenarios — well played. Time for a break ☕️'}</div>`;
          }
        }
        return;
      }

      // Pick a random unused scenario
      const { task, repo: selectedRepo, scenarioId } = allCandidates[Math.floor(Math.random() * allCandidates.length)];
      usedScenarioBatch.add(scenarioId);

      // Spawn the new card with bottom-fly-in animation
      const newCard = spawnTwinTestCard(task, selectedRepo);
      if (newCard) {
        newCard.classList.add('fly-in-from-bottom');
        setTimeout(() => newCard.classList.remove('fly-in-from-bottom'), 600);
      }
    }

    /* ── Global drag and resize handlers ── */
    document.addEventListener('mousemove', (e) => {
      if (!dragState) return;
      const { card, startX, startY, isResizing, startWidth, startHeight } = dragState;

      if (isResizing) {
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        const newWidth = Math.max(300, startWidth + deltaX);
        const newHeight = Math.max(200, startHeight + deltaY);
        card.style.width = newWidth + 'px';
        card.style.height = newHeight + 'px';
      } else {
        card.style.left = (e.clientX - startX) + 'px';
        card.style.top = (e.clientY - startY) + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      if (dragState) {
        dragState.card.classList.remove('dragging');
        dragState.card.classList.remove('resizing');
        dragState = null;
      }
    });

    document.addEventListener('touchmove', (e) => {
      if (!dragState) return;
      const touch = e.touches[0];
      const { card, startX, startY, isResizing, startWidth, startHeight } = dragState;

      if (isResizing) {
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;
        const newWidth = Math.max(300, startWidth + deltaX);
        const newHeight = Math.max(200, startHeight + deltaY);
        card.style.width = newWidth + 'px';
        card.style.height = newHeight + 'px';
      } else {
        card.style.left = (touch.clientX - startX) + 'px';
        card.style.top = (touch.clientY - startY) + 'px';
      }
    }, { passive: true });

    document.addEventListener('touchend', () => {
      if (dragState) {
        dragState.card.classList.remove('dragging');
        dragState.card.classList.remove('resizing');
        dragState = null;
      }
    });

    /* ── Check if canvas is empty ── */
    function checkEmpty() {
      const canvas = document.getElementById('workshopCanvas');
      const cards = canvas.querySelectorAll('.task-card');
      const empty = document.getElementById('canvasEmpty');
      if (cards.length === 0) {
        empty.classList.remove('hidden');
      }
    }

    /* ── Clear All ── */
    document.getElementById('btnClearAll').addEventListener('click', () => {
      const canvas = document.getElementById('workshopCanvas');
      const cards = canvas.querySelectorAll('.task-card');
      cards.forEach((card, i) => {
        setTimeout(() => {
          card.classList.add('minimizing');
          setTimeout(() => card.remove(), 300);
        }, i * 60);
      });
      setTimeout(checkEmpty, cards.length * 60 + 400);
    });

    /* ── Random Task ── */
    document.getElementById('btnRandomTask').addEventListener('click', () => {
      const repo = REPOSITORIES[Math.floor(Math.random() * REPOSITORIES.length)];
      spawnRandomFromRepo(repo);
    });

    /* ── Language change handler ── */
    document.addEventListener('languageChange', () => {
      buildDock();
      // Rebuild any active cards on language change
      const canvas = document.getElementById('workshopCanvas');
      const cards = canvas.querySelectorAll('.task-card');
      if (cards.length > 0) {
        // Show a simple indicator that language has changed
        applyI18n(); // Apply i18n to top bar and canvas empty state
      }
    });

    /* ── Init ── */
    initI18n(); // Initialize i18n system
    buildDock();
    setupCreationsButton();
    displayCardLibrary();
    initTwinTestMode(); // ?skill=… → fetch + banner + morph cards into A/B blind test

    /* ═══════════════════════════════════════
       TWIN TEST MODE
       Triggered when arena.html?skill=<id> is loaded.
       Replaces the fusion-canvas card UI with a
       blind A/B test of the same scenario, run
       through the live Skill vs a baseline AI.
       ═══════════════════════════════════════ */

    function getAnonymousId() {
      let id = localStorage.getItem('42post_anon_id');
      if (!id) {
        id = 'anon_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('42post_anon_id', id);
      }
      return id;
    }

    async function initTwinTestMode() {
      // Update the canvas-empty messaging to reflect the Twin Test flow.
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      const hint = document.querySelector('.canvas-empty-hint');
      if (hint) {
        hint.textContent = isCn
          ? '点击下方任一分类 → 挑一个 Skill 看看它如何改变 AI 的回应'
          : 'TAP A CATEGORY BELOW → PICK A SKILL TO SEE HOW IT CHANGES THE AI';
      }

      // Pre-warm the hot-skills cache so the first card opens snappily.
      fetchHotSkills().catch(() => {});

      const params = new URLSearchParams(window.location.search);
      const skillId = params.get('skill');
      if (!skillId) return; // dock click will let user pick a skill in the card

      try {
        const resp = await fetch(`/api/skills/${encodeURIComponent(skillId)}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        const skill = json.skill || json;
        if (!skill || !skill.id) throw new Error('Skill payload missing id');
        if (typeof skill.five_layer === 'string') {
          try { skill.five_layer = JSON.parse(skill.five_layer); } catch { skill.five_layer = {}; }
        }
        window.TWIN_TEST_SKILL = skill;

        // Coming from Archive's "▶ Play" — drop the user straight into a
        // ready-to-test card. We pick a domain that matches the skill if
        // possible, then a random scenario from it. The dock is still
        // visible so the user can keep playing other categories.
        const skillDomain = (skill.domain || '').toLowerCase();
        const matchedRepo =
          REPOSITORIES.find(r => r.id === skillDomain) ||
          REPOSITORIES[Math.floor(Math.random() * REPOSITORIES.length)];
        const task = matchedRepo.tasks[Math.floor(Math.random() * matchedRepo.tasks.length)];
        // Defer one frame so the canvas has finished its first layout pass.
        requestAnimationFrame(() => spawnCard(task, matchedRepo));
      } catch (err) {
        console.warn('Twin Test init failed (proceeding without preset skill):', err.message);
      }
    }

    /* Fetch picker skills (cached for the session). The /picker endpoint
       puts skills the current device created (matched on anonymous_id)
       at the top, then fills with community-hot skills by starlight.
       New visitors with no forges still get a sensible default — the
       most-starred community skill leads. */
    async function fetchHotSkills(limit = 8) {
      if (window.__hotSkillsCache) return window.__hotSkillsCache.slice(0, limit);
      const anonId = encodeURIComponent(getAnonymousId());
      let skills = [];
      try {
        const resp = await fetch(`/api/playground/picker?anonymous_id=${anonId}&limit=20`);
        if (resp.ok) {
          const json = await resp.json();
          skills = json.skills || [];
        }
      } catch (e) {
        console.warn('Picker endpoint failed, falling back to /skills:', e.message);
      }
      // Fallback for older deployments without /picker.
      if (!skills.length) {
        const resp = await fetch('/api/skills?limit=50');
        if (!resp.ok) throw new Error(`Failed to fetch skills (HTTP ${resp.status})`);
        const json = await resp.json();
        skills = (json.skills || []).slice();
        skills.sort((a, b) => (b.starlight_score || 0) - (a.starlight_score || 0));
      }
      window.__hotSkillsCache = skills;
      return skills.slice(0, limit);
    }

    function getSkillPrincipleLine(skill) {
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      const fl = skill.five_layer || {};
      // Only show Chinese principle for card display
      if (isCn) {
        return fl.principle_cn || skill.description_cn || '';
      }
      return fl.principle || fl.defining?.principle || skill.description || '';
    }
    function getSkillTitle(skill) {
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      return isCn ? (skill.title_cn || skill.title) : (skill.title || skill.title_cn);
    }

    function spawnTwinTestCard(task, repo) {
      const canvas = document.getElementById('workshopCanvas');
      const empty = document.getElementById('canvasEmpty');
      empty.classList.add('hidden');

      const card = document.createElement('div');
      card.className = 'task-card spawning';
      card.dataset.cardId = ++cardIdCounter;
      card.style.zIndex = ++highestZ;

      // Responsive card width: 420px on desktop, 340px on mobile
      const cardW = window.innerWidth > 768 ? 420 : 340;
      const maxX = canvas.clientWidth - cardW;
      const maxY = canvas.clientHeight - (window.innerWidth > 768 ? 520 : 480);
      const x = 40 + Math.random() * Math.max(maxX - 80, 100);
      const y = 30 + Math.random() * Math.max(maxY - 60, 100);
      card.style.left = x + 'px';
      card.style.top = y + 'px';
      card.style.setProperty('--card-color', repo.color);
      card.style.width = cardW + 'px';

      const td = getTaskDisplay(task);
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');

      card.innerHTML = `
        <div class="card-header">
          <div class="card-header-left">
            <span class="twin-header-dot">●</span>
            <div class="twin-skill-line" data-skill-line>
              <span class="twin-skill-placeholder">${isCn ? '挑一个热门 Skill 来测' : 'Pick a Hot Skill to Test'}</span>
            </div>
          </div>
          <div class="card-header-right" style="display:flex;gap:12px;align-items:center;">
            <span class="twin-vote-counter" data-vote-counter style="font-size:12px;color:#777;font-family:var(--font-mono);"></span>
            <button class="card-close" title="${isCn ? '关闭' : 'Close'}" style="font-size:14px;cursor:pointer;">✕</button>
          </div>
        </div>
        <div class="card-body card-body--twin">
          <div class="twin-principle" data-principle hidden></div>

          <div class="twin-scenario-tag">
            <span>${getRepoName(repo)}</span>
          </div>
          <div class="twin-scenario-title">${td.title}</div>
          ${td.desc ? `<div class="twin-scenario-desc">${td.desc}</div>` : ''}

          <div class="twin-stage twin-pickskill" hidden>
            <div class="twin-pickskill-label">${isCn ? '挑一个 Skill 来测' : 'Pick a Skill to test'}</div>
            <select class="twin-skill-select" data-skill-select style="width:100%;padding:10px 14px;border:1.5px solid #d4c8a8;border-radius:6px;background:#fdfaf3;font-family:inherit;font-size:clamp(11px, 3vw, 12px);color:#5a5048;cursor:pointer;font-weight:400;line-height:1.6;letter-spacing:0.2px;transition:all 0.15s ease;">
              <option value="" disabled>${isCn ? '— 选择 —' : '— Select —'}</option>
            </select>
            <button class="twin-pickskill-confirm" data-skill-confirm
                    style="width:100%;margin-top:14px;padding:12px;background:#2a2520;color:#fdfaf3;border:none;border-radius:6px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.18s ease;"
                    disabled>
              ${isCn ? '使用这个 Skill →' : 'Use this Skill →'}
            </button>
            <a class="twin-pickskill-archive-link" href="index.html#archive" style="display:block;margin-top:12px;">${isCn ? '或在 Archive 浏览全部 →' : 'Or browse all in Archive →'}</a>
          </div>

          <div class="twin-stage twin-trigger" hidden>
            <div class="twin-trigger-stats" data-trigger-stats></div>
            <button class="twin-trigger-btn" data-trigger-btn>${isCn ? '▶ 开始测试' : '▶ START TEST'}</button>
          </div>

          <div class="twin-stage twin-loading" hidden>
            <span class="twin-spinner">⟳</span>
            <span class="twin-loading-text">generating two responses…</span>
          </div>

          <!-- Reveal-mode rating stage. Replaces the legacy blind-pick UI:
               we now show both responses with the skill side clearly
               labelled, ask for a 3-level reaction + an optional 140-char
               comment, then submit. Lighter, more game-like, and the data
               we collect is "did this skill feel different?" instead of
               "could you guess which one?". -->
          <div class="twin-stage twin-rate" hidden>
            <div class="twin-rate-grid">
              <div class="twin-rate-card" data-side="A">
                <div class="twin-rate-label">
                  <span class="twin-rate-side">A</span>
                  <span class="twin-rate-tag" data-tag-a></span>
                </div>
                <div class="twin-rate-text" data-text-a></div>
              </div>
              <div class="twin-rate-card" data-side="B">
                <div class="twin-rate-label">
                  <span class="twin-rate-side">B</span>
                  <span class="twin-rate-tag" data-tag-b></span>
                </div>
                <div class="twin-rate-text" data-text-b></div>
              </div>
            </div>
            <div class="twin-rate-diagnostic" data-rate-diag hidden></div>
            <div class="twin-rate-question">How was this Skill?</div>
            <div class="twin-rate-buttons">
              <button class="twin-rate-btn" data-rating="better">
                <span class="twin-rate-emoji">🔥</span>
                <span class="twin-rate-word">Clearly better</span>
              </button>
              <!-- Negative slot is "worse" rather than the original
                   "neutral" — the research side needs a real negative
                   signal to detect skills that hurt rather than help. -->
              <button class="twin-rate-btn" data-rating="worse">
                <span class="twin-rate-emoji">😕</span>
                <span class="twin-rate-word">Not great</span>
              </button>
              <button class="twin-rate-btn" data-rating="no_diff">
                <span class="twin-rate-emoji">🤔</span>
                <span class="twin-rate-word">Can't tell</span>
              </button>
            </div>
            <!-- Always-visible optional note. The textarea sits in
                 the flow at minimal weight (one line tall, paper
                 background, no border drama) so it doesn't compete
                 with the rating buttons. Whatever's typed when the
                 user taps a rating is sent with the feedback; if
                 they tap without typing, no note is recorded. -->
            <textarea class="twin-rate-comment"
                      data-comment
                      maxlength="140"
                      rows="4"
                      placeholder="${isCn ? '💭 有其他想法？（可选，140字以内）' : '💭 Anything else? (optional, 140 chars)'}"></textarea>
            <span class="twin-rate-counter" data-comment-counter>0 / 140</span>
          </div>

          <!-- Thank-you stage. Single CTA per user feedback — two
               buttons added decision overhead. "Try another Skill"
               drops the cached skill and respawns a fresh card so the
               user lands back at the picker (with a new random
               scenario), keeping the play loop short. -->
          <div class="twin-stage twin-thanks" hidden>
            <div class="twin-thanks-headline">${isCn ? '感谢你的反馈！' : 'Thank you for your feedback!'}</div>
            <div class="twin-thanks-stats" data-thanks-stats></div>
            <div class="twin-thanks-actions">
              <button type="button" class="twin-thanks-prompt twin-thanks-btn">${isCn ? '↓ 换个场景看看效果' : '↓ Try a different scenario'}</button>
            </div>
          </div>
        </div>
        <div class="card-resize-handle" title="Drag to resize"></div>
      `;

      // Save repo reference for "try another scenario" button
      card._repo = repo;

      // Close button
      card.querySelector('.card-close').addEventListener('click', (e) => {
        e.stopPropagation();
        card.classList.add('minimizing');
        setTimeout(() => { card.remove(); checkEmpty(); }, 300);
      });

      // "换个场景看看效果" button — spawn a new card from the same repo
      const tryAnotherBtn = card.querySelector('.twin-thanks-btn');
      if (tryAnotherBtn) {
        tryAnotherBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          handleTryAnotherScenario(card, repo);
        });
      }

      // Interactive elements that must keep their default behaviour
      // (select dropdown opening, link navigation, text input focus, etc.).
      // The drag handler calls preventDefault, so anything not listed here
      // would have its native click/open behaviour swallowed.
      const isInteractive = (el) => !!el.closest(
        '.card-close, button, .card-resize-handle, select, option, input, textarea, a, label'
      );

      // Focus on click
      card.addEventListener('mousedown', (e) => {
        if (isInteractive(e.target)) return;
        card.style.zIndex = ++highestZ;
      });

      // Drag (mouse + touch) — same handlers as fusion mode but excluding twin buttons
      const dragGuard = (e) => isInteractive(e.target);
      card.addEventListener('mousedown', (e) => {
        if (dragGuard(e)) return;
        e.preventDefault();
        card.classList.add('dragging');
        card.style.zIndex = ++highestZ;
        dragState = { card, startX: e.clientX - card.offsetLeft, startY: e.clientY - card.offsetTop };
      });
      card.addEventListener('touchstart', (e) => {
        if (dragGuard(e)) return;
        const t = e.touches[0];
        card.classList.add('dragging');
        card.style.zIndex = ++highestZ;
        dragState = { card, startX: t.clientX - card.offsetLeft, startY: t.clientY - card.offsetTop };
      }, { passive: true });

      // Resize
      const rh = card.querySelector('.card-resize-handle');
      rh.addEventListener('mousedown', (e) => {
        e.preventDefault();
        card.classList.add('resizing');
        card.style.zIndex = ++highestZ;
        dragState = { card, isResizing: true, startX: e.clientX, startY: e.clientY, startWidth: card.offsetWidth, startHeight: card.offsetHeight };
      });

      canvas.appendChild(card);
      setTimeout(() => card.classList.remove('spawning'), 600);

      // Always show skill picker first — user selects a skill (or uses default)
      // then confirms with "Use this Skill" button to enter the test flow.
      showSkillPickerInCard(card, task, repo);

      return card;
    }

    /* Fetch the picker (which already orders user-own first, then
       community-hot) and apply the first row directly. Falls back to
       the explicit picker UI if the fetch fails or returns nothing. */
    async function autoLoadDefaultSkill(card, task, repo) {
      try {
        const skills = await fetchHotSkills(7);
        if (!skills || skills.length === 0) {
          showSkillPickerInCard(card, task, repo);
          return;
        }
        const first = skills[0];
        if (typeof first.five_layer === 'string') {
          try { first.five_layer = JSON.parse(first.five_layer); } catch { first.five_layer = {}; }
        }
        window.TWIN_TEST_SKILL = first;
        applyTwinSkillToCard(card, first);
        showTwinTestTrigger(card, task, repo);
      } catch (e) {
        console.warn('autoLoadDefaultSkill failed, falling back to picker:', e.message);
        showSkillPickerInCard(card, task, repo);
      }
    }

    async function showTwinTestTrigger(card, task, repo) {
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      const skill = window.TWIN_TEST_SKILL;
      const stage = card.querySelector('.twin-trigger');
      const statsLine = stage.querySelector('[data-trigger-stats]');
      const btn = stage.querySelector('[data-trigger-btn]');

      // Hide skill picker stage
      const pickskillStage = card.querySelector('.twin-pickskill');
      if (pickskillStage) pickskillStage.hidden = true;

      stage.hidden = false;

      // Friendly invite — the previous "win rate / blind picks"
      // framing belonged to the old blind-vote model. The new flow
      // reveals which side is which up-front, so we just tee up the
      // skill title and let the user push Start.
      const skillTitle = getSkillTitle(skill);
      statsLine.innerHTML = isCn
        ? `🎯 <strong>${skillTitle}</strong> — 一键生成两个回应，看看这个 Skill 让 AI 怎样不一样`
        : `🎯 <strong>${skillTitle}</strong> — one click, two responses, see how this Skill changes the AI`;

      // Wire the START action exactly once per card.
      if (!stage.dataset.wired) {
        btn.addEventListener('click', () => {
          stage.hidden = true;
          runTwinTest(card, task, repo);
        });
        stage.dataset.wired = '1';
      }
    }

    function updateVoteCounter(card) {
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      const todayKey = 'votedSkillsToday_' + new Date().toISOString().split('T')[0];
      const votedSkills = JSON.parse(localStorage.getItem(todayKey) || '[]');
      const counter = card.querySelector('[data-vote-counter]');
      if (counter) {
        if (votedSkills.length > 0) {
          counter.textContent = isCn ? `投票 #${votedSkills.length}` : `Vote #${votedSkills.length}`;
        } else {
          counter.textContent = '';
        }
      }
    }

    function applyTwinSkillToCard(card, skill) {
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      const skillTitle = getSkillTitle(skill);
      const principle = getSkillPrincipleLine(skill);

      // Header skill name
      const skillLine = card.querySelector('[data-skill-line]');
      if (skillLine) {
        skillLine.innerHTML = `
          <span class="twin-skill-icon">🎯</span>
          <span>${skillTitle || (isCn ? '当前 Skill' : 'Current Skill')}</span>
        `;
      }

      // Principle quote (hidden)
      const pEl = card.querySelector('[data-principle]');
      if (pEl) {
        pEl.hidden = true;
      }

      // Question line in pick stage
      const qText = card.querySelector('[data-question-text]');
      if (qText) {
        qText.textContent = isCn
          ? `哪一段真正体现了「${skillTitle}」？`
          : `Which one truly embodies "${skillTitle}"?`;
      }

      // Update vote counter
      updateVoteCounter(card);
    }

    async function showSkillPickerInCard(card, task, repo) {
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      const stage = card.querySelector('.twin-pickskill');
      const select = stage.querySelector('[data-skill-select]');
      stage.hidden = false;

      try {
        const skills = await fetchHotSkills(7);
        if (skills.length === 0) {
          select.innerHTML = `<option disabled>${isCn ? '还没有 Skill' : 'No Skills yet'}</option>`;
          return;
        }

        // Populate dropdown. The picker endpoint already orders the
        // user's own skills first (is_mine=true), so we just render in
        // the order received and tag the user's own with a 👋 prefix
        // so it visually leads.
        skills.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          const baseLabel = `${getSkillTitle(s)} · ${s.domain || '—'} (⭐${s.starlight_score || 0})`;
          opt.textContent = s.is_mine
            ? (isCn ? `👋 你刚锻造的：${baseLabel}` : `👋 Your latest forge — ${baseLabel}`)
            : baseLabel;
          opt.dataset.skill = JSON.stringify(s);
          select.appendChild(opt);
        });

        const confirmBtn = stage.querySelector('[data-skill-confirm]');
        if (skills.length > 0) {
          // Auto-select: prioritize Archive-sourced skill, fallback to first
          const preloadedSkillId = window.TWIN_TEST_SKILL?.id;
          const selectedSkillId = preloadedSkillId && skills.some(s => s.id === preloadedSkillId)
            ? preloadedSkillId
            : skills[0].id;

          select.value = selectedSkillId;
          confirmBtn.disabled = false;
        }

        // Enable / disable the confirm button alongside the dropdown.
        select.addEventListener('change', () => {
          confirmBtn.disabled = !select.value;
        });

        confirmBtn.addEventListener('click', () => {
          const skillId = select.value;
          if (!skillId) return;
          const opt = select.querySelector(`option[value="${skillId}"]`);
          if (!opt) return;
          const skill = JSON.parse(opt.dataset.skill);
          if (typeof skill.five_layer === 'string') {
            try { skill.five_layer = JSON.parse(skill.five_layer); } catch { skill.five_layer = {}; }
          }
          window.TWIN_TEST_SKILL = skill;
          stage.hidden = true;
          applyTwinSkillToCard(card, skill);
          showTwinTestTrigger(card, task, repo);
        });
      } catch (err) {
        console.error('Skill picker error:', err);
        select.innerHTML = `<option disabled>${isCn ? '加载失败' : 'Load failed'}</option>`;
      }
    }

    /* Reveal-mode Twin Test:
       1. POST /api/playground/test → returns response_a, response_b,
          skill_side, diagnostic.
       2. Render both responses with the skill side labelled up-front
          (no blind pick).
       3. User picks one of three reactions (🔥 / 😐 / 🤔) plus an
          optional 140-char comment, hits Submit.
       4. POST /api/playground/feedback → thank-you + counts. */
    async function runTwinTest(card, task, repo) {
      const skill = window.TWIN_TEST_SKILL;
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      const td = getTaskDisplay(task);
      const stageLoading = card.querySelector('.twin-loading');
      const stageRate = card.querySelector('.twin-rate');
      stageLoading.hidden = false;

      // Apply responsive animation: expand on large screens, fade on small.
      const isSmallScreen = window.innerWidth <= 480;
      stageLoading.classList.add(isSmallScreen ? 'fade-animation' : 'expand-animation');

      const anonId = getAnonymousId();
      console.log('🚀 Twin Test starting:', { skill_id: skill.id, scenario: td.title, anonId });

      try {
        const payload = {
          skill_id: skill.id,
          scenario: { title: td.title, description: td.desc, domain: repo.id, key: `${repo.id}::${td.title}` },
          anonymous_id: anonId,
          language: isCn ? 'zh' : 'en'
        };

        const resp = await fetch('/api/playground/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ message: `HTTP ${resp.status}` }));
          throw new Error(err.message || `API error ${resp.status}`);
        }

        const data = await resp.json();
        if (!data.response_a || !data.response_b) {
          throw new Error('API returned empty responses');
        }

        card.dataset.testId = data.test_id;
        card.dataset.skillSide = data.skill_side || '';

        // Populate the rate stage. Side labels show 🔥 "with skill" /
        // ◯ "no skill" tags so the user knows which is which up-front.
        stageRate.querySelector('[data-text-a]').textContent = data.response_a;
        stageRate.querySelector('[data-text-b]').textContent = data.response_b;

        const skillTagText = isCn ? '🔥 加了 Skill' : '🔥 with this Skill';
        const baselineTagText = isCn ? '◯ 普通 AI' : '◯ baseline AI';
        stageRate.querySelector('[data-tag-a]').textContent =
          data.skill_side === 'A' ? skillTagText : baselineTagText;
        stageRate.querySelector('[data-tag-b]').textContent =
          data.skill_side === 'B' ? skillTagText : baselineTagText;
        stageRate.querySelector('[data-side="A"]').classList.toggle('twin-rate-skill', data.skill_side === 'A');
        stageRate.querySelector('[data-side="B"]').classList.toggle('twin-rate-skill', data.skill_side === 'B');

        // Update UI text based on language
        stageRate.querySelector('.twin-loading-text').textContent =
          isCn ? '正在生成两个回应…' : 'generating two responses…';
        stageRate.querySelector('.twin-rate-question').textContent =
          isCn ? '这个 Skill 效果怎么样？' : 'How was this Skill?';
        const btnTexts = [
          isCn ? '明显更好' : 'Clearly better',
          isCn ? '不大好' : 'Not great',
          isCn ? '没感觉到区别' : "Can't tell"
        ];
        stageRate.querySelectorAll('.twin-rate-word').forEach((el, i) => {
          if (i < btnTexts.length) el.textContent = btnTexts[i];
        });

        // The diagnostic was generated server-side comparing the two
        // responses. Show it as a soft hint between the cards and the
        // rating prompt — gives the user something to react to.
        const diagEl = stageRate.querySelector('[data-rate-diag]');
        if (data.diagnostic) {
          diagEl.textContent = data.diagnostic;
          diagEl.hidden = false;
        } else {
          diagEl.hidden = true;
        }

        // Wire the rating buttons (only once per card).
        if (!stageRate.dataset.wired) {
          wireTwinRateStage(card, task, repo);
          stageRate.dataset.wired = '1';
        }

        // Reset any stale state from a previous round (when user clicks
        // "Try another Skill" the same DOM gets re-used).
        stageRate.querySelectorAll('.twin-rate-btn').forEach(b => {
          b.classList.remove('selected');
          b.disabled = false;
        });
        const commentEl = stageRate.querySelector('[data-comment]');
        commentEl.value = '';
        stageRate.querySelector('[data-comment-counter]').textContent = '0 / 140';
        delete stageRate.dataset.rating;
        delete stageRate.dataset.submitting;

        stageLoading.hidden = true;
        stageRate.hidden = false;
        stageRate.classList.add(isSmallScreen ? 'fade-animation' : 'expand-animation');
      } catch (err) {
        console.error('❌ Twin Test error:', err);
        stageLoading.innerHTML = `<div style="color:#b85a4a;font-size:12px;line-height:1.5;">
          <strong>${isCn ? '生成失败' : 'Generation failed'}</strong><br/>
          ${err.message}<br/>
          <span style="font-size:11px;color:#8a7a6e;">${isCn ? '(查看浏览器控制台了解更多)' : '(check browser console)'}</span>
        </div>`;
      }
    }

    /* One-time wiring for the rate stage's interactive bits. Bound
       once per card. Tap-to-submit model: clicking a reaction button
       immediately fires submitTwinFeedback. The optional note
       textarea is always visible underneath; whatever's typed at the
       moment of tap goes along with the feedback. */
    function wireTwinRateStage(card, task, repo) {
      const stageRate = card.querySelector('.twin-rate');
      const commentEl = stageRate.querySelector('[data-comment]');
      const counterEl = stageRate.querySelector('[data-comment-counter]');

      stageRate.querySelectorAll('.twin-rate-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (stageRate.dataset.submitting === '1') return;
          stageRate.dataset.submitting = '1';
          stageRate.querySelectorAll('.twin-rate-btn').forEach(b => {
            b.classList.remove('selected');
            b.disabled = true;
          });
          btn.classList.add('selected');
          stageRate.dataset.rating = btn.dataset.rating;
          // Brief flash so the user sees their tap register before the
          // card transitions to the thank-you stage.
          await new Promise(r => setTimeout(r, 120));
          await submitTwinFeedback(card, task, repo, btn.dataset.rating, commentEl.value.trim());
        });
      });

      commentEl.addEventListener('input', () => {
        counterEl.textContent = `${commentEl.value.length} / 140`;
      });
    }

    async function submitTwinFeedback(card, task, repo, rating, comment) {
      const isCn = (typeof currentLang !== 'undefined' && currentLang === 'cn');
      const stageRate = card.querySelector('.twin-rate');
      const stageThanks = card.querySelector('.twin-thanks');

      try {
        const resp = await fetch('/api/playground/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            test_id: card.dataset.testId,
            rating,
            comment: comment || '',
            anonymous_id: getAnonymousId()
          })
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${resp.status}`);
        }
        const data = await resp.json();

        // Render aggregate stats: how many testers, what % said better.
        const total = data.total || 0;
        const betterPct = total > 0 ? Math.round((data.better_rate || 0) * 100) : null;
        const statsEl = stageThanks.querySelector('[data-thanks-stats]');
        if (total > 0 && betterPct !== null) {
          statsEl.innerHTML = isCn
            ? `🎯 ${betterPct}% 的测试者觉得这个 Skill <strong>明显更好</strong> · 共 ${total} 次反馈`
            : `🎯 ${betterPct}% of testers said this Skill was <strong>clearly better</strong> · ${total} feedbacks`;
        } else {
          statsEl.textContent = isCn ? '你是第一个反馈这个 Skill 的人 ✨' : 'You are the first to rate this Skill ✨';
        }

        stageRate.hidden = true;
        stageThanks.hidden = false;
        const isSmallScreen = window.innerWidth <= 480;
        stageThanks.classList.add(isSmallScreen ? 'fade-animation' : 'expand-animation');

        // No interactive elements on thanks stage — user is guided to scenario cards below
      } catch (err) {
        // Re-enable the rating buttons so the user can retry. The
        // tap-to-submit model has no separate Submit control to
        // restore; clearing the submitting flag is enough.
        delete stageRate.dataset.submitting;
        stageRate.querySelectorAll('.twin-rate-btn').forEach(b => b.disabled = false);
        alert((isCn ? '提交失败：' : 'Submit failed: ') + err.message);
      }
    }
  </script>
